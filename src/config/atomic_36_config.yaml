meta:
  engine: 4.2.1
  version: 0.1.0
  author: Edward Evans
units:
  # proxy spacing vars
  kx: cx
  ky: cy
  # padding vars
  px: kx + 4
  py: ky + 4
  # render choc spacings
  $default_width: cx
  $default_height: cy
points:
  zones:
    matrix:
      # fix kicad placement
      anchor:
        shift: [150, -150]
      key:
        padding: u
        spread: 1kx
      columns:
        pinky:
          key:
            splay: 9
            column_net: GP15
        ring:
          key:
            spread: 1kx + 1.8
            splay: -9
            stagger: 5
            column_net: GP14
        middle:
          key:
            stagger: 5
            column_net: GP13
        index:
          key:
            stagger: -5
            column_net: GP12
        inner:
          key:
            spread: 1kx + 1.2
            splay: -5
            stagger: -2.0
            column_net: GP11
      rows:
        bottom:
          row_net: GP27
        home:
          row_net: GP28
        top:
          row_net: GP29
    thumbs:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: matrix_index_bottom
        shift: [-3, -1.2ky]
      columns:
        mod:
          key:
            splay: -4.5
            column_net: GP13
        layer:
          key:
            spread: 1kx + 2.5
            splay: -12
            shift: [0, -2.1]
            column_net: GP12
        space:
          key:
            spread: 1kx + 3
            splay: -12
            shift: [0, -4.2]
            column_net: GP11
      rows:
        cluster:
          row_net: GP26
outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      size: [kx - 0.5, ky - 0.5]
  pcb_board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_pinky_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_top
          shift: [0.7px, 0.5py]
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_top
          shift: [0.3px, 0.5py]
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        - ref: matrix_index_top
          shift: [-0.3px, 0.5py]
        - ref: matrix_index_top
          shift: [0.4px, 0.5py]
        - ref: matrix_inner_top
          shift: [-0.3px, 0.5py]
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]
        # MCU / interconnect space
        - ref: matrix_inner_top
          shift: [1.6px, 0.5py]
        - ref: matrix_inner_bottom
          shift: [1.6px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [0.5px, 0.5py]
        - ref: thumbs_space_cluster
          shift: [0.5px, -0.5py]
        - ref: thumbs_layer_cluster
          shift: [0.3px, -0.5py]
        - ref: thumbs_layer_cluster
          shift: [-0.4px, -0.5py]
        - ref: thumbs_mod_cluster
          shift: [-0.5px, -0.5py]
        - ref: matrix_index_bottom
          shift: [-0.6px, -0.5py]
        - ref: matrix_middle_bottom
          shift: [-0.3px, -0.75py]
        - ref: matrix_ring_bottom
          shift: [-0.3px, -0.55py]
        - ref: matrix_pinky_bottom
          shift: [0.5px, -0.5py]
        - ref: matrix_pinky_bottom
          shift: [-0.5px, -0.5py]
      fillet: 2
  switch_plate:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_pinky_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_pinky_top
          shift: [0.7px, 0.5py]
        - ref: matrix_ring_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_ring_top
          shift: [0.3px, 0.5py]
        - ref: matrix_middle_top
          shift: [-0.5px, 0.5py]
        - ref: matrix_middle_top
          shift: [0.5px, 0.5py]
        - ref: matrix_index_top
          shift: [-0.3px, 0.5py]
        - ref: matrix_index_top
          shift: [0.4px, 0.5py]
        - ref: matrix_inner_top
          shift: [-0.3px, 0.5py]
        - ref: matrix_inner_top
          shift: [0.5px, 0.5py]
        # MCU / interconnect space
        - ref: matrix_inner_bottom
          shift: [0.5px, -0.5py]
        - ref: thumbs_space_cluster
          shift: [0.5px, 0.5py]
        - ref: thumbs_space_cluster
          shift: [0.5px, -0.5py]
        - ref: thumbs_layer_cluster
          shift: [0.3px, -0.5py]
        - ref: thumbs_layer_cluster
          shift: [-0.4px, -0.5py]
        - ref: thumbs_mod_cluster
          shift: [-0.5px, -0.5py]
        - ref: matrix_index_bottom
          shift: [-0.6px, -0.5py]
        - ref: matrix_middle_bottom
          shift: [-0.3px, -0.7py]
        - ref: matrix_ring_bottom
          shift: [-0.3px, -0.5py]
        - ref: matrix_pinky_bottom
          shift: [0.5px, -0.5py]
        - ref: matrix_pinky_bottom
          shift: [-0.5px, -0.5py]
      fillet: 2
  combo:
    - name: pcb_board
    - operation: subtract
      name: keys
pcbs:
  board:
    template: kicad8
    outlines:
      main:
        outline: pcb_board
    footprints:
      choc_hotswap:
        # use regex to split left/right pcb switch pos
        # if you set where to true, you get them on the same kicad
        # plane -> maybe use this to have one PCB for manufacture.
        where: "/^(matrix|thumbs)_/"
        what: ceoloide/switch_choc_v1_v2
        params:
          reversible: true
          hotswap: true
          solder: false
          include_keycap: true
          keycap_width: kx
          keycap_height: ky
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        where: "/^(matrix|thumbs)_/"
        what: ceoloide/diode_tht_sod123
        params:
          reversible: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
      mcu:
        what: rp2040zero
        where: matrix_inner_top
        params:
          include_button_cutout: false
          reverse: false
        adjust:
          shift: [0.6px, -0.75py]
          rotate: 0
      interconnect:
        what: usbc
        where: matrix_inner_home
        adjust:
          shift: [1.45px, -0.5py]
          rotate: 90
        params:
          reversible: true
cases:
